<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ERP4 Browser Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>ERP4 Browser Capture</h1>
      <p>利用者が選択したfieldだけをERP4の確認画面へ渡します。</p>
      <p>送信先: <strong id="destination"></strong></p>
      <p id="status" role="status" aria-live="polite"></p>
      <fieldset>
        <legend>取得field</legend>
        <div id="fields"></div>
      </fieldset>
      <div class="actions">
        <button id="handoff" type="button">ERP4で確認</button>
        <button id="recapture" type="button">現在ページを再取得</button>
        <button id="discard" type="button">保留draftを破棄</button>
      </div>
      <p class="notice">
        scopeと最終送信fieldはERP4で再確認します。browser終了時にはdraftが失われる場合があります。
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
