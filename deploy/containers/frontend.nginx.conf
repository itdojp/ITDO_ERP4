server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  set $erp4_frontend_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://accounts.google.com https://*.googleusercontent.com; font-src 'self' data:; connect-src __ERP4_FRONTEND_CONNECT_SRC__ https://accounts.google.com; frame-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; media-src 'none'";

  add_header Content-Security-Policy $erp4_frontend_csp always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;

  location ~ ^/(sw|share-target-sw|share-target-mode)\.js$ {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $erp4_frontend_csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $erp4_frontend_csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
